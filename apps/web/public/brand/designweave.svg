<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>DesignWeave</title>
  <defs>
    <radialGradient id="dw-bg" cx="512" cy="500" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5E74"/>
      <stop offset="0.55" stop-color="#364859"/>
      <stop offset="1" stop-color="#243140"/>
    </radialGradient>
    <radialGradient id="dw-glow" cx="512" cy="512" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1E6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#243140" stop-opacity="0"/>
    </radialGradient>
    <filter id="dw-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dw-bloom-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="dw-tile">
      <rect width="1024" height="1024" rx="229"/>
    </clipPath>
    <clipPath id="dw-right">
      <rect x="512" y="160" width="400" height="704"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dw-tile)">
    <rect width="1024" height="1024" fill="url(#dw-bg)"/>
    <rect width="1024" height="1024" fill="url(#dw-glow)"/>

    <!-- HUD ticks -->
    <g stroke="#B7D3E2" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round">
      <line x1="512" y1="72" x2="512" y2="128"/>
      <line x1="498" y1="88" x2="526" y2="88"/>
      <line x1="512" y1="896" x2="512" y2="952"/>
      <line x1="498" y1="936" x2="526" y2="936"/>
      <line x1="72" y1="512" x2="128" y2="512"/>
      <line x1="88" y1="498" x2="88" y2="526"/>
      <line x1="896" y1="512" x2="952" y2="512"/>
      <line x1="936" y1="498" x2="936" y2="526"/>
      <g stroke-width="1.6" stroke-opacity="0.12">
        <line x1="512" y1="168" x2="512" y2="196"/>
        <line x1="512" y1="828" x2="512" y2="856"/>
        <line x1="168" y1="512" x2="196" y2="512"/>
        <line x1="828" y1="512" x2="856" y2="512"/>
      </g>
    </g>
    <rect x="36" y="36" width="952" height="952" rx="202" stroke="#C5E8F0" stroke-opacity="0.1" stroke-width="2"/>

    <!--
      F: slate HUD, cyan TL→BR over lime BL→TR on the left;
      lime over cyan on the right. Twin traces + terminal nodes.
    -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g filter="url(#dw-bloom-soft)">
        <path d="M248 760C400 760 400 264 776 264" stroke="#7CFF9B" stroke-opacity="0.35" stroke-width="22"/>
        <path d="M248 264C400 264 400 760 776 760" stroke="#5CE1E6" stroke-opacity="0.35" stroke-width="22"/>
      </g>
      <g filter="url(#dw-bloom)">
        <path d="M248 760C400 760 400 264 776 264" stroke="#7CFF9B" stroke-width="8"/>
        <path d="M236 776C388 776 388 248 764 248" stroke="#7CFF9B" stroke-opacity="0.7" stroke-width="4"/>
        <path d="M248 264C400 264 400 760 776 760" stroke="#5CE1E6" stroke-width="8"/>
        <path d="M236 248C388 248 388 776 764 776" stroke="#5CE1E6" stroke-opacity="0.7" stroke-width="4"/>
      </g>
      <g clip-path="url(#dw-right)" filter="url(#dw-bloom)">
        <path d="M248 760C400 760 400 264 776 264" stroke="#7CFF9B" stroke-width="8"/>
        <path d="M236 776C388 776 388 248 764 248" stroke="#7CFF9B" stroke-opacity="0.7" stroke-width="4"/>
      </g>
    </g>

    <g filter="url(#dw-bloom)">
      <g fill="#5CE1E6">
        <circle cx="248" cy="264" r="15"/>
        <circle cx="776" cy="760" r="15"/>
      </g>
      <g fill="#7CFF9B">
        <circle cx="248" cy="760" r="15"/>
        <circle cx="776" cy="264" r="15"/>
      </g>
      <g fill="none" stroke-width="3">
        <circle cx="248" cy="264" r="26" stroke="#5CE1E6" stroke-opacity="0.45"/>
        <circle cx="776" cy="760" r="26" stroke="#5CE1E6" stroke-opacity="0.45"/>
        <circle cx="248" cy="760" r="26" stroke="#7CFF9B" stroke-opacity="0.45"/>
        <circle cx="776" cy="264" r="26" stroke="#7CFF9B" stroke-opacity="0.45"/>
      </g>
    </g>
  </g>
</svg>
