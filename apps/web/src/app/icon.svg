<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>DesignWeave</title>
  <defs>
    <linearGradient id="dw-bg" x1="160" y1="40" x2="880" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="0.5" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#E8DFD0"/>
    </linearGradient>
    <radialGradient id="dw-wash" cx="512" cy="480" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A06A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dw-gold" x1="250" y1="300" x2="780" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0C48A"/>
      <stop offset="0.5" stop-color="#D4773B"/>
      <stop offset="1" stop-color="#B85F28"/>
    </linearGradient>
    <linearGradient id="dw-moss" x1="780" y1="280" x2="250" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AAD90"/>
      <stop offset="0.5" stop-color="#6B8F71"/>
      <stop offset="1" stop-color="#4E7356"/>
    </linearGradient>
    <clipPath id="dw-tile">
      <rect width="1024" height="1024" rx="229"/>
    </clipPath>
    <clipPath id="dw-right">
      <rect x="512" y="180" width="360" height="660"/>
    </clipPath>
    <filter id="dw-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3D3428" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g clip-path="url(#dw-tile)">
    <rect width="1024" height="1024" fill="url(#dw-bg)"/>
    <rect width="1024" height="1024" fill="url(#dw-wash)"/>
    <rect x="34" y="34" width="956" height="956" rx="204" stroke="#1C1914" stroke-opacity="0.1" stroke-width="3"/>

    <!--
      Same weave as the workbench mark.
      Gold over moss on the left; moss over gold on the right.
      Mid moss + oil-lamp gold on xuan paper — not a dark tile, so later
      paper themes (green, rose, night) can recast the in-app mark.
    -->
    <g filter="url(#dw-soft)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M286 656C398 656 398 368 512 368S626 656 738 656" stroke="url(#dw-moss)" stroke-width="86"/>
      <path d="M286 368C398 368 398 656 512 656S626 368 738 368" stroke="url(#dw-gold)" stroke-width="86"/>
    </g>
    <g clip-path="url(#dw-right)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M286 656C398 656 398 368 512 368S626 656 738 656" stroke="url(#dw-moss)" stroke-width="86"/>
    </g>
  </g>
</svg>
