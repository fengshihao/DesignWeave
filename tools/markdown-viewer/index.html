<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>墨览 · Markdown Studio</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("molan-theme");
        if (t === "night" || t === "hack" || t === "rose" || t === "xuan") {
          document.documentElement.setAttribute("data-theme", t);
        }
        var l = localStorage.getItem("molan-lang");
        if (l === "ar") document.documentElement.setAttribute("dir", "rtl");
        if (l === "zh") document.documentElement.lang = "zh-CN";
        else if (l === "zh-Hant") document.documentElement.lang = "zh-TW";
        else if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.9/dist/index.css" />
  <link rel="stylesheet" href="./molan.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <h1>墨<span>览</span><em class="brand-latin">molan</em></h1>
        </div>
        <div class="prefs">
          <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="界面样式" data-i18n-aria="themeAria">
            <button type="button" role="radio" data-theme="xuan" title="宣纸 · 暖色纸面" aria-label="宣纸" data-i18n-title="themeXuanTitle" data-i18n-aria="themeXuan" aria-checked="true">
              <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
            </button>
            <button type="button" role="radio" data-theme="night" title="墨夜 · 暗色夜读" aria-label="墨夜" data-i18n-title="themeNightTitle" data-i18n-aria="themeNight" aria-checked="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
            </button>
            <button type="button" role="radio" data-theme="hack" title="终端 · 程序员" aria-label="终端" data-i18n-title="themeHackTitle" data-i18n-aria="themeHack" aria-checked="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
            </button>
            <button type="button" role="radio" data-theme="rose" title="胭脂 · 柔粉纸面" aria-label="胭脂" data-i18n-title="themeRoseTitle" data-i18n-aria="themeRose" aria-checked="false">
              <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="theme-ring" cx="16" cy="16" r="14.25"/><circle class="theme-fill" cx="16" cy="16" r="10"/></svg>
            </button>
          </div>
          <label class="lang-switch">
            <select id="langSelect" aria-label="界面语言" data-i18n-aria="langAria"></select>
          </label>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input class="search" id="searchInput" type="search" placeholder="搜索文档或最近目录…" data-i18n-placeholder="searchPlaceholder" />
        </div>
      </div>

      <div class="library-head">
        <div class="library-label" id="libraryTitle">最近目录</div>
        <div class="library-actions">
          <button class="icon-add" id="pickBtn" type="button" title="打开文件夹" aria-label="打开文件夹" data-i18n-title="pickFolder" data-i18n-aria="pickFolder">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3.25v9.5M3.25 8h9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-add icon-add-quiet" id="pickFallbackBtn" type="button" hidden title="兼容模式选文件夹" aria-label="兼容模式选文件夹" data-i18n-title="pickCompatTitle" data-i18n-aria="pickCompat">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.6 5.4h4.1l1.1 1.4h5.6v6.2H2.6z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
              <path d="M4.2 4.2h3.2l.8 1.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="folder-meta" id="folderMeta"></div>
      <div class="file-list" id="fileList">
        <div class="empty-side">
          <span class="glyph">卷</span>
          <p data-i18n="emptyHint">点右侧 + 打开本地目录。</p>
        </div>
      </div>
    </aside>

    <main class="main is-idle">
      <header class="reader-header">
        <div class="reader-title">
          <h2 id="readerTitle">墨览</h2>
        </div>
        <div class="reader-actions">
          <button class="chip chip-primary" id="saveBtn" type="button" hidden disabled data-i18n="save">保存</button>
          <button class="chip" id="copyBtn" type="button" hidden data-i18n="copySource">复制原文</button>
        </div>
      </header>

      <div class="reader-body" id="readerBody">
        <section class="welcome" id="welcome">
          <div class="welcome-stage">
            <div class="welcome-copy">
              <div class="welcome-seal" aria-hidden="true">
                <span class="welcome-seal-ink">墨</span>
                <span class="welcome-chop">览</span>
              </div>
              <p class="welcome-kicker" data-i18n="welcomeKicker">本地 Markdown 工作室</p>
              <h2 data-i18n="welcomeTitle">开卷即写</h2>
              <p class="welcome-lead" data-i18n="welcomeLead">打开文件夹，在纸面上改 Markdown。保存写回原文件。</p>
              <div class="welcome-actions">
                <button class="welcome-cta" id="welcomePickBtn" type="button" data-i18n="welcomeCta">打开文件夹</button>
                <span class="welcome-note" data-i18n="localOffline">本地 · 不上云</span>
              </div>
            </div>

            <article class="welcome-sheet" aria-hidden="true">
              <p class="sheet-kicker" data-i18n="welcomeMeta">流程图 · 表格 · 代码 · 公式</p>
              <h3 data-i18n="welcomeSheetTitle">一张纸，写完即在</h3>
              <blockquote data-i18n="welcomeSheetQuote">本地目录是真相源；编辑器只是打开它的窗口。</blockquote>
              <div class="sheet-body">
                <figure class="sheet-flow">
                  <figcaption data-i18n="welcomeShotFlow">流程图</figcaption>
                  <svg class="shot-mermaid" viewBox="0 0 280 72" aria-hidden="true">
                    <defs>
                      <marker id="molanArr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
                        <path d="M0 0l7 3-7 3z"/>
                      </marker>
                    </defs>
                    <rect class="shot-node" x="6" y="18" width="72" height="34" rx="8"/>
                    <text x="42" y="40" text-anchor="middle" data-i18n="welcomeNodeDraft">草稿</text>
                    <rect class="shot-node" x="104" y="18" width="72" height="34" rx="8"/>
                    <text x="140" y="40" text-anchor="middle" data-i18n="welcomeNodeRender">渲染</text>
                    <rect class="shot-node shot-node-acc" x="202" y="18" width="72" height="34" rx="8"/>
                    <text x="238" y="40" text-anchor="middle" data-i18n="welcomeNodeWrite">写回</text>
                    <line x1="78" y1="35" x2="102" y2="35" marker-end="url(#molanArr)"/>
                    <line x1="176" y1="35" x2="200" y2="35" marker-end="url(#molanArr)"/>
                  </svg>
                </figure>
                <figure class="sheet-table">
                  <figcaption data-i18n="welcomeShotTable">表格</figcaption>
                  <table class="shot-table">
                    <thead>
                      <tr>
                        <th data-i18n="welcomeColLayer">层</th>
                        <th data-i18n="welcomeColDuty">职责</th>
                        <th data-i18n="welcomeColCraft">材料</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td data-i18n="welcomeRowPaper">纸</td>
                        <td data-i18n="welcomeDutyCarry">承载</td>
                        <td data-i18n="welcomeCraftXuan">宣纸</td>
                      </tr>
                      <tr>
                        <td data-i18n="welcomeRowInk">墨</td>
                        <td data-i18n="welcomeDutyColor">着色</td>
                        <td data-i18n="welcomeCraftPine">松烟</td>
                      </tr>
                      <tr>
                        <td data-i18n="welcomeRowBrush">笔</td>
                        <td data-i18n="welcomeDutyWrite">书写</td>
                        <td data-i18n="welcomeCraftWolf">狼毫</td>
                      </tr>
                    </tbody>
                  </table>
                </figure>
                <figure class="sheet-code">
                  <figcaption data-i18n="welcomeShotCode">代码</figcaption>
                  <pre class="shot-code"><code><span class="k">function</span> grind(ink) {
  <span class="k">return</span> ink.water(<span class="n">3</span>);
}</code></pre>
                </figure>
                <figure class="sheet-math">
                  <figcaption data-i18n="welcomeShotMath">公式</figcaption>
                  <p class="shot-math"><em>e</em><sup>iπ</sup> + 1 = 0</p>
                </figure>
              </div>
            </article>
          </div>
        </section>
        <div class="editor-wrap" id="editorWrap">
          <div id="vditor"></div>
        </div>
      </div>

      <footer class="status-bar">
        <span id="statusLeft" data-i18n="waitingFolder">等待选择文件夹</span>
        <span id="statusRight" data-i18n="localOffline">本地 · 不上云</span>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <input class="hidden-input" id="dirInput" type="file" webkitdirectory directory multiple tabindex="-1" aria-hidden="true" />

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="流程图观看" data-i18n-aria="lightboxTitle">
      <div class="lightbox-bar">
        <div>
          <strong data-i18n="lightboxTitle">流程图观看</strong>
          <span class="hint" data-i18n="lightboxHint">拖动平移 · 滚轮缩放 · Esc 关闭</span>
        </div>
        <div class="lightbox-actions">
          <button class="icon-btn" type="button" id="lightboxZoomOut" title="缩小" aria-label="缩小" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
          </button>
          <button class="icon-btn" type="button" id="lightboxZoomIn" title="放大" aria-label="放大" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
          </button>
          <button class="icon-btn" type="button" id="lightboxReset" title="复位" aria-label="复位" data-i18n-title="resetView" data-i18n-aria="resetView">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </button>
          <button class="icon-btn" type="button" id="lightboxCopyImage" title="复制图片" aria-label="复制图片" data-i18n-title="copyImage" data-i18n-aria="copyImage">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg>
          </button>
          <button class="icon-btn" type="button" id="lightboxClose" title="关闭" aria-label="关闭" data-i18n-title="close" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div class="lightbox-stage" id="lightboxStage">
        <div class="lightbox-canvas" id="lightboxCanvas"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.9/dist/index.min.js"></script>
  <script src="./molan-i18n.js"></script>
  <script src="./molan-editor.js"></script>
  <script src="./molan-app.js"></script>
</body>
</html>
