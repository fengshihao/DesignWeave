name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @designweave/schema build
          pnpm --filter @designweave/prompts build
          pnpm --filter @designweave/molan-protocol build
          pnpm --filter @designweave/molan-core build
          pnpm --filter @designweave/molan-host build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install xvfb for VS Code extension E2E
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: VS Code extension bundle check
        run: pnpm --filter molan-markdown check
