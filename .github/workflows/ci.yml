name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DesignWeave
        uses: actions/checkout@v4
        with:
          path: DesignWeave

      - name: Checkout molan (sibling)
        uses: actions/checkout@v4
        with:
          repository: fengshihao/molan
          path: molan

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            DesignWeave/pnpm-lock.yaml
            molan/pnpm-lock.yaml

      - name: Install molan
        working-directory: molan
        run: pnpm install --frozen-lockfile

      - name: Build molan packages
        working-directory: molan
        run: pnpm build

      - name: Install DesignWeave
        working-directory: DesignWeave
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        working-directory: DesignWeave
        run: |
          pnpm --filter @designweave/schema build
          pnpm --filter @designweave/prompts build
          pnpm --filter @designweave/web sync-molan

      - name: Typecheck
        working-directory: DesignWeave
        run: pnpm typecheck

      - name: Unit tests
        working-directory: DesignWeave
        run: pnpm test
